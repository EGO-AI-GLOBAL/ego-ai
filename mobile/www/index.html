<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#0f0f12" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>EGO-AI</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        padding: max(1.5rem, env(safe-area-inset-top))
          max(1.5rem, env(safe-area-inset-right))
          max(1.5rem, env(safe-area-inset-bottom))
          max(1.5rem, env(safe-area-inset-left));
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: linear-gradient(165deg, #1a1025 0%, #0f0f12 55%, #0d1520 100%);
        color: #e8e8ed;
        text-align: center;
      }
      .logo {
        font-size: 2rem;
        font-weight: 700;
        letter-spacing: -0.03em;
      }
      .logo span {
        color: #a78bfa;
      }
      .spinner {
        width: 2.25rem;
        height: 2.25rem;
        border: 3px solid rgba(167, 139, 250, 0.25);
        border-top-color: #7c3aed;
        border-radius: 50%;
        animation: spin 0.85s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      p {
        margin: 0;
        max-width: 20rem;
        line-height: 1.5;
        font-size: 0.9rem;
        color: #94a3b8;
      }
      code {
        font-size: 0.78rem;
        color: #c4b5fd;
      }
    </style>
  </head>
  <body>
    <div class="logo">EGO<span>-AI</span></div>
    <div class="spinner" aria-hidden="true"></div>
    <p>A abrir o assistente…</p>
    <p id="hint" hidden>
      Configure <code>EGO_APP_URL</code> em <code>mobile/.env</code> e execute
      <code>npm run cap:sync</code>.
    </p>
  </body>
</html>
